name = "api-cf"
main = "cfapi/_worker.js"
compatibility_date = "2025-09-09"

[build]
command = ""

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "api-rotation-db"
database_id = "ca6fcd39-e720-4002-a380-f6c07368b1d3"

[[analytics_engine_datasets]]
binding = "LOGS"
dataset = "ai_gateway_logs"

# ---- 固定出口地区，解决 OpenAI 403 unsupported_country_region_territory ----
[[durable_objects.bindings]]
name = "GEO_PROXY"
class_name = "GeoProxy"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GeoProxy"]
